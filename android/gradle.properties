# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Enable R8 in release builds to shrink, optimize and obfuscate the Java/Kotlin code.
# The app is optimized using the `proguard-android-optimize.txt` preset.
# Add custom keep rules to android/app/proguard-rules.pro.
# See https://developer.android.com/topic/performance/app-optimization/enable-app-optimization
#
# TEMPORARILY DISABLED (hand-over build).
#
# With R8 enabled the release APK crashes on launch before the first Activity
# is created:
#
#   java.lang.RuntimeException: Unable to get provider
#   androidx.startup.InitializationProvider
#   Caused by: java.lang.RuntimeException: Failed to create an instance of
#   class androidx.work.impl.WorkDatabase.canonicalName
#
# androidx.startup's InitializationProvider runs WorkManagerInitializer from
# `androidx.work:work-runtime:2.9.1` (pulled in by react-native-maps) before
# the app starts. WorkManager resolves its Room database implementation *by
# name*, so R8 renames or removes the class and the provider fails to
# instantiate it. The consumer rules shipped inside the WorkManager AAR keep
# only the Worker classes, not the Room database, so the gap has to be closed
# by the application.
#
# The keep rules that fix it are already written and ready in
# `android/app/proguard-rules.pro` (see `withProguardRules` in
# `app.config.ts`), and the build script re-applies them after a prebuild.
# They are simply not used while R8 is off.
#
# To re-enable minification later: set this back to `true` and confirm the
# keep rules in `android/app/proguard-rules.pro` are still in place.
android.enableMinifyInReleaseBuilds=false

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use this property to enable edge-to-edge display support.
# This allows your app to draw behind system bars for an immersive UI.
# Note: Only works with ReactActivity and should not be used with custom Activity.
edgeToEdgeEnabled=true

# Enable GIF support in React Native's <Image> component.
# Disable to reduce app size if you only render GIFs via expo-image.
# See https://docs.expo.dev/distribution/app-size/
expo.gif.enabled=true
# Enable WebP support in React Native's <Image> component.
# Disable to reduce app size if you only render WebP via expo-image.
# See https://docs.expo.dev/distribution/app-size/
expo.webp.enabled=true
# Enable animated WebP support in React Native's <Image> component.
# Disabled by default because iOS doesn't support animated WebP.
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false

expo.inlineModules.watchedDirectories=[]
# --- Toolchain settings ----------------------------------------------
#
# The Android build compiles the native code with a Java 21 toolchain.
# These two settings point Gradle at a JDK that is already installed
# rather than letting it try to download one, which fails on a machine
# with no access to the download service:
#
#   auto-download=false  stops Gradle fetching a JDK.
#   paths=...             the JDK 21 that ships with Android Studio.
#
# Gradle falls back to JAVA_HOME when that path does not exist, so this
# is harmless on a machine without Android Studio.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:\\Program Files\\Android\\Android Studio\\jbr
